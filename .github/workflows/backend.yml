name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: metricme_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:local-ci-only@localhost:5432/metricme_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew -PbackendOnly :contracts:test :backend:test :backend:installDist :backend:distZip --console=plain
      - name: Build deployment container
        run: docker build -t metricme-test .
      - name: Verify running container and database readiness
        run: bash scripts/backend-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests-and-distribution
          path: |
            backend/build/reports/
            contracts/build/reports/
            backend/build/distributions/
